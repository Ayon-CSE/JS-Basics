<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body style="background-color: black; color: white">
    <button class="orange">Orange</button>
    <button class="green">Green</button>
  </body>

  <script>
    // document.querySelector('.orange').addEventListener('click', function() {
    //     document.body.style.backgroundColor = 'orange';
    // })

    // document.querySelector('.green').addEventListener('click', function() {
    //     document.body.style.backgroundColor = 'green';
    // })

    function clickHandler(color) {
      function changeColor() {
         document.body.style.backgroundColor = color;
      };

      return changeColor; // outer function return korle click er agei immediately return hoye jabe, tai inner function disi jate click korar por inner function call hoye color change kore dey
    }

    document
      .querySelector(".orange")
      .addEventListener("click", clickHandler("orange")); 
      // dry (don't repeat yourself) principle e clickHandler function ke reuse korlam, jate onno color er jonno notun function na likhte hoy, just clickHandler function ke call kore color pass kore dilei hoy
    document
      .querySelector(".green")
      .addEventListener("click", clickHandler("green"));
  </script>
</html>
