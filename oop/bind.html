<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>React</title>
  </head>
  <body>
    <button>Click</button>
  </body>

  <script>
    class React {
      constructor() {
        this.library = "React";
        this.server = "https://localhost:3000";

        document.querySelector("button").addEventListener("click", this.handleClick.bind(this));// bind(this)) korlam react class e connect korar jonno, jate this.server er value pai, na hole undefined pabo
      }

      handleClick() {
        console.log("button clicked");
        console.log(this);// this holo react class er property 
      }
    }

    let app = new React();
  </script>
</html>
